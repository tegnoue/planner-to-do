<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/assets/css/app.css">
</head>
<body class="min-h-screen text-slate-800">
  <div class="min-h-screen lg:grid lg:grid-cols-[250px_1fr]">
    <aside class="sidebar p-6 flex flex-col gap-8">
      <div class="flex items-center gap-3"><div class="brand-mark">✦</div><div><div class="font-extrabold text-lg">daymark</div><div class="text-xs text-slate-400">seu espaço pessoal</div></div></div>
      <nav class="space-y-2">
        <button class="nav-link active" data-view="board"><span>▦</span> Meu quadro</button>
        <button class="nav-link" data-view="calendar"><span>▣</span> Calendário</button>
      </nav>
      <section><div class="section-label">SUAS ETIQUETAS</div><div id="tag-list" class="mt-3 space-y-2"></div><button id="new-tag" class="text-sm text-slate-500 mt-3 hover:text-indigo-600">＋ Criar etiqueta</button></section>
      <div class="mt-auto rounded-2xl bg-indigo-50 p-4"><div class="text-sm font-bold text-indigo-900">Um passo de cada vez</div><p class="text-xs text-indigo-700 mt-1">Organize suas ideias e siga no seu ritmo.</p></div>
    </aside>
    <main class="p-5 md:p-9 max-w-[1500px] w-full mx-auto">
      <header class="flex flex-wrap items-center justify-between gap-4 mb-8">
        <div><div class="text-sm text-slate-400" id="today-label"></div><h1 class="font-display text-3xl md:text-4xl font-extrabold mt-1" id="page-title">Meu quadro</h1></div>
        <button id="open-create" class="primary-btn">＋ <span>Nova tarefa</span></button>
      </header>
      <section id="board-view"><div class="flex items-center justify-between mb-5"><p class="text-sm text-slate-500">Transforme seus planos em progresso.</p><button id="refresh" class="text-sm text-indigo-600">Atualizar ↻</button></div><div id="board" class="grid md:grid-cols-3 gap-5"></div></section>
      <section id="calendar-view" class="hidden"><div class="flex flex-wrap items-center gap-3 mb-5"><button id="prev-week" class="icon-btn">←</button><button id="next-week" class="icon-btn">→</button><h2 id="week-label" class="font-bold ml-2"></h2><button id="this-week" class="ml-auto text-sm text-indigo-600">Esta semana</button></div><div id="calendar" class="grid sm:grid-cols-2 lg:grid-cols-7 gap-3"></div></section>
    </main>
  </div>
  <dialog id="task-dialog" class="modal"><form id="task-form" class="p-6 space-y-4"><div class="flex items-center justify-between"><h2 class="font-display text-xl font-extrabold">Nova tarefa</h2><button type="button" class="close-btn" data-close>×</button></div>
    <label class="field-label">O que você precisa fazer?<input name="title" required maxlength="240" placeholder="Ex.: Revisar capítulo 3"></label>
    <label class="field-label">Detalhes<textarea name="description" rows="2" placeholder="Adicione uma nota (opcional)"></textarea></label>
    <div class="grid grid-cols-2 gap-3"><label class="field-label">Prioridade<select name="priority"><option value="low">Baixa</option><option value="medium" selected>Média</option><option value="urgent">Urgente</option></select></label><label class="field-label">Prazo<input name="due_at" type="datetime-local"></label></div>
    <label class="field-label">Tipo<select name="kind" id="kind-select"><option value="single">Tarefa única</option><option value="recurring">Série recorrente</option></select></label>
    <div id="recurrence-fields" class="hidden grid grid-cols-2 gap-3"><label class="field-label col-span-2">Repetir<select name="rrule"><option value="FREQ=WEEKLY;BYDAY=MO">Toda segunda-feira</option><option value="FREQ=WEEKLY;BYDAY=TU">Toda terça-feira</option><option value="FREQ=WEEKLY;BYDAY=WE">Toda quarta-feira</option><option value="FREQ=WEEKLY;BYDAY=TH">Toda quinta-feira</option><option value="FREQ=WEEKLY;BYDAY=FR">Toda sexta-feira</option><option value="FREQ=DAILY">Todos os dias</option></select></label><label class="field-label">Começa em<input name="dtstart" type="datetime-local"></label></div>
    <label class="field-label">Etiqueta<select name="tag_id" id="task-tag"><option value="">Sem etiqueta</option></select></label><div id="form-error" class="text-sm text-red-600"></div>
    <div class="flex justify-end gap-2 pt-2"><button type="button" class="secondary-btn" data-close>Cancelar</button><button class="primary-btn">Criar tarefa</button></div>
  </form></dialog>
  <dialog id="tag-dialog" class="modal"><form id="tag-form" class="p-6 space-y-4"><div class="flex justify-between"><h2 class="font-display text-xl font-extrabold">Nova etiqueta</h2><button type="button" class="close-btn" data-close>×</button></div><label class="field-label">Nome<input name="name" required maxlength="60" placeholder="Ex.: Faculdade"></label><label class="field-label">Cor<input name="color" type="color" value="#7764e8"></label><div class="flex justify-end"><button class="primary-btn">Criar etiqueta</button></div></form></dialog>
  <script src="/static/assets/js/app.js"></script>
</body></html>
